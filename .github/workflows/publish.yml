name: Tag qualification (publication disabled)

on:
  push:
    tags:
      - "v*"

concurrency:
  group: qualification-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  qualify:
    uses: ./.github/workflows/batch-core.yml
    # Tag pushes qualify the actual root package only. Publishing requires a separately reviewed release change.
